name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    strategy:
      matrix:
        python-version: [3.10, 3.11]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Prepare virtualenv and sync
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv sync

      - name: Run tests
        run: |
          uv run pytest -q

      - name: Run linters
        run: |
          command -v uv >/dev/null 2>&1 && uv run ruff check . || true
          command -v uv >/dev/null 2>&1 && uv run black --check . || true
